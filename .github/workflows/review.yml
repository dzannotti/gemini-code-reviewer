name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Gemini CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            /usr/local/lib/node_modules/@google/gemini-cli
          key: ${{ runner.os }}-gemini-cli-v1
          restore-keys: |
            ${{ runner.os }}-gemini-cli-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun i

      - name: Install CLI agents
        run: |
          if ! command -v gemini &> /dev/null; then
            npm install -g @google/gemini-cli
          fi
          if ! command -v copilot &> /dev/null; then
            npm install -g @github/copilot
          fi

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Review
        env:
          REVIEW_BACKEND: copilot  # or "gemini"
          REVIEW_MODEL: gpt-5-mini # optional, backend-specific
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run index.ts

      - name: Collect debug files
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/gemini-debug
          cp /tmp/gemini-*.json $GITHUB_WORKSPACE/gemini-debug/ 2>/dev/null || true
          ls -la $GITHUB_WORKSPACE/gemini-debug/

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-debug-${{ github.event.pull_request.number }}
          path: ${{ github.workspace }}/gemini-debug/
          retention-days: 7
          if-no-files-found: warn
